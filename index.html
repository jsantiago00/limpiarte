  // ---------- Transit (OneBusAway / Mendotran) ----------
  function haversine(lat1, lon1, lat2, lon2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function fetchOBA(path, params) {
    var url = OBA_BASE + path + '?' + Object.keys(params).map(function(k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');
    return fetch(url).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(json) {
      if (json.code !== 200) throw new Error('API code ' + json.code);
      return json.data;
    });
  }

  function parseMapsCoords(text) {
    text = (text || '').trim();
    if (!text) return null;
    // Coordenadas copiadas en formato es-AR, con coma como separador decimal:
    // "-32,92834923, -68,2938429374"
    var esMatch = text.match(/^(-?\d{1,3},\d+)\s*,\s*(-?\d{1,3},\d+)$/);
    if (esMatch) {
      return { lat: parseFloat(esMatch[1].replace(',', '.')), lon: parseFloat(esMatch[2].replace(',', '.')) };
    }
    var patterns = [
      /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,
      /[?&](?:q|query)=(-?\d+\.\d+),(-?\d+\.\d+)/,
      /@(-?\d+\.\d+),(-?\d+\.\d+)/,
      /^(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)$/
    ];
    for (var i = 0; i < patterns.length; i++) {
      var m = text.match(patterns[i]);
      if (m) return { lat: parseFloat(m[1]), lon: parseFloat(m[2]) };
    }
    return null;
  }

  function nearestStopFromList(lat, lon, list) {
    return list.reduce(function(best, s) {
      var d = haversine(lat, lon, s.lat, s.lon);
      return (!best || d < best.d) ? { stop: s, d: d } : best;
    }, null);
  }

  function findNearestStopByCoords(lat, lon) {
    return fetchOBA('stops-for-location.json', { lat: lat, lon: lon, latSpan: 0.006, lonSpan: 0.006 })
      .then(function(data) {
        var list = data.list || data.stops || [];
        if (!list.length) throw new Error('Sin paradas cercanas');
        return nearestStopFromList(lat, lon, list).stop;
      });
  }

  function getCurrentPosition() {
    return new Promise(function(resolve, reject) {
      if (!navigator.geolocation) { reject(new Error('sin soporte de geolocalización')); return; }
      navigator.geolocation.getCurrentPosition(
        function(pos) { resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }); },
        function(err) {
          var e = new Error(err.message || 'permiso denegado');
          e.code = err.code;
          reject(e);
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
      );
    });
  }

  // ---------- Marcar en el mapa (Leaflet + tiles de OpenStreetMap) ----------
  var leafletPickerMap = null;
  var pickedMapMarker = null;
  var pickedMapCoords = null;
  var mapPickerCallback = null;

  function fetchGeocode(query) {
    var url = OBA_BASE + 'geocode.json?q=' + encodeURIComponent(query);
    return fetch(url).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(body) {
      if (body.code !== 200) throw new Error(body.text || ('código ' + body.code));
      return body.data || [];
    });
  }

  function fetchReverseGeocode(lat, lon) {
    var url = OBA_BASE + 'reverse.json?lat=' + lat + '&lon=' + lon;
    return fetch(url).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(body) {
      if (body.code !== 200) throw new Error(body.text || ('código ' + body.code));
      return body.data && body.data.label;
    });
  }

  function setPickedMapPoint(lat, lon, skipMove) {
    pickedMapCoords = { lat: lat, lon: lon };
    if (pickedMapMarker) { pickedMapMarker.setLatLng([lat, lon]); }
    else { pickedMapMarker = L.marker([lat, lon]).addTo(leafletPickerMap); }
    if (!skipMove) leafletPickerMap.panTo([lat, lon]);
    document.getElementById('mapConfirmBtn').disabled = false;
    var labelEl = document.getElementById('mapPickedLabel');
    labelEl.className = 'map-status-line';
    labelEl.textContent = 'Buscando la dirección...';
    fetchReverseGeocode(lat, lon).then(function(label) {
      labelEl.className = 'map-status-line ok';
      labelEl.textContent = label || (lat.toFixed(5) + ', ' + lon.toFixed(5));
    }).catch(function() {
      labelEl.className = 'map-status-line ok';
      labelEl.textContent = lat.toFixed(5) + ', ' + lon.toFixed(5);
    });
  }

  // onPick(coords, label) se llama cuando el usuario confirma un punto. existing, si se
  // pasa, centra el mapa ahí de entrada (por ejemplo, la ubicación ya guardada del hogar).
  function closeMapPickerRaw() {
    document.getElementById('mapOverlay').hidden = true;
  }
  function closeMapPicker() {
    var wasOpen = !document.getElementById('mapOverlay').hidden;
    closeMapPickerRaw();
    if (wasOpen) popNavLevel();
  }

  function openMapPicker(existing, onPick) {
    mapPickerCallback = onPick;
    pickedMapCoords = null;
    document.getElementById('mapConfirmBtn').disabled = true;
    document.getElementById('mapPickedLabel').className = 'map-status-line';
    document.getElementById('mapPickedLabel').textContent = 'Todavía no tocaste el mapa.';
    document.getElementById('mapOverlay').hidden = false;
    pushNavLevel();

    if (!leafletPickerMap) {
      leafletPickerMap = L.map('mapContainer').setView([-32.89, -68.84], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(leafletPickerMap);
      leafletPickerMap.on('click', function(e) { setPickedMapPoint(e.latlng.lat, e.latlng.lng); });
    } else {
      pickedMapMarker = null;
    }
    setTimeout(function() { leafletPickerMap.invalidateSize(); }, 60);

    if (existing && existing.lat && existing.lon) {
      leafletPickerMap.setView([existing.lat, existing.lon], 16);
      setPickedMapPoint(existing.lat, existing.lon, true);
    }
  }

  document.getElementById('mapClose').addEventListener('click', closeMapPicker);
  document.getElementById('mapConfirmBtn').addEventListener('click', function() {
    if (!pickedMapCoords || !mapPickerCallback) return;
    var label = document.getElementById('mapPickedLabel').textContent;
    mapPickerCallback(pickedMapCoords, label);
    closeMapPicker();
  });

  function findStopForHome(home) {
    if (!home.lat || !home.lon) { toast('Cargá latitud y longitud primero'); return; }
    var box = document.getElementById('transitBox');
    if (box) box.innerHTML = '<p class="transit-loading">Buscando parada cercana...</p>';
    findNearestStopByCoords(home.lat, home.lon)
      .then(function(stop) {
        home.stopId = stop.id;
        home.stopName = stop.name;
        home.stopAddress = stop.address || '';
        home.stopLat = stop.lat;
        home.stopLon = stop.lon;
        save();
        if (box) box.innerHTML = '<p style="font-size:12.5px;color:var(--muted);">Parada guardada: ' + escapeHtml(stop.address || stop.name) + '</p>';
        toast('Parada guardada');
      })
      .catch(function(err) {
        if (box) box.innerHTML = '<p style="font-size:12.5px;color:var(--danger);">No se pudo buscar la parada (' + escapeHtml(err.message) + '). Usá Google Maps como alternativa.</p>';
      });
  }

  function fmtClockTime(ms) {
    var d = new Date(ms);
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function arrivalsHtml(arrivals, destIndex) {
    if (!arrivals.length) return '<p style="font-size:12.5px;color:var(--muted);margin:4px 0 0;">No hay llegadas previstas por ahora.</p>';
    var now = Date.now();
    var enriched = arrivals.map(function(a) {
      return { a: a, destMatch: (destIndex && a.tripId) ? destIndex[a.tripId] : null };
    });
    enriched.sort(function(x, y) {
      var xOk = x.destMatch ? 0 : 1, yOk = y.destMatch ? 0 : 1;
      if (xOk !== yOk) return xOk - yOk;
      return (x.a.predictedArrivalTime || x.a.scheduledArrivalTime) - (y.a.predictedArrivalTime || y.a.scheduledArrivalTime);
    });
    var rows = enriched.slice(0, 5).map(function(item) {
      var a = item.a;
      var t = a.predictedArrivalTime || a.scheduledArrivalTime;
      var mins = Math.round((t - now) / 60000);
      var route = a.routeShortName || a.routeId || '';
      var convenient = !!item.destMatch;
      var etaLine = '';
      if (convenient) {
        var dt = item.destMatch.predictedArrivalTime || item.destMatch.scheduledArrivalTime;
        etaLine = '<div class="arrival-eta">Llegás cerca de las ' + fmtClockTime(dt) + '</div>';
      }
      return '<div class="arrival' + (convenient ? ' convenient' : '') + '">' +
        '<div class="arrival-top"><span>' + escapeHtml(route) + ' · ' + escapeHtml(a.tripHeadsign || '') + (convenient ? ' <span class="tag-ok">te conviene</span>' : '') + '</span><span>' + (mins <= 0 ? 'Ahora' : mins + ' min') + '</span></div>' +
        etaLine +
      '</div>';
    }).join('');
    return '<div class="transit-result">' + rows + '</div>';
  }

  function mapsSearchLink(stop) {
    return (stop && stop.lat && stop.lon) ? 'https://www.google.com/maps/search/?api=1&query=' + stop.lat + ',' + stop.lon : null;
  }

  function stopLocationHtml(stop) {
    var mapsLink = mapsSearchLink(stop);
    return '<p style="font-size:13.5px;font-weight:700;margin:0 0 2px;">' + escapeHtml(stop.address || stop.name) + '</p>' +
      '<p style="font-size:11.5px;margin:0 0 6px;color:var(--muted);">Parada ' + escapeHtml(stop.name) +
      (mapsLink ? ' · <a href="' + mapsLink + '" target="_blank" rel="noopener" class="link-btn" style="font-size:11.5px;">Ver en el mapa</a>' : '') +
      '</p>';
  }

  function journeyStep(tag, tagClass, routeLine, place, timeLine) {
    var routePart = routeLine ? '<div class="step-route">' + escapeHtml(routeLine) + '</div>' : '';
    var placePart = '';
    if (place && place.label) {
      var link = mapsSearchLink(place.stop);
      placePart = '<div class="step-place">' + escapeHtml(place.label) + (link ? ' · <a href="' + link + '" target="_blank" rel="noopener" class="link-btn">Ver en el mapa</a>' : '') + '</div>';
    }
    return '<div class="journey-step">' +
      '<span class="step-tag ' + tagClass + '">' + tag + '</span>' +
      '<div class="step-body">' + routePart + placePart + '<div class="step-time">' + escapeHtml(timeLine) + '</div></div>' +
    '</div>';
  }

  function candidatesHtml(candidates) {
    var now = Date.now();
    return candidates.map(function(c) {
      var mins = Math.round((c.originTime - now) / 60000);
      return '<div class="arrival convenient">' +
        '<div class="journey-head"><span class="step-route">' + escapeHtml(c.route + ' · ' + c.headsign) + '</span><span class="journey-when">' + (mins <= 0 ? 'Ahora' : mins + ' min') + '</span></div>' +
        journeyStep('Subís', 'board', '', { label: c.originStop.address || c.originStop.name, stop: c.originStop }, 'Sale a las ' + fmtClockTime(c.originTime)) +
        journeyStep('Bajás', 'alight', '', { label: c.destStop.address || c.destStop.name, stop: c.destStop }, 'Llegás ~' + fmtClockTime(c.destTime)) +
      '</div>';
    }).join('');
  }

  function twoLegCandidatesHtml(candidates) {
    var now = Date.now();
    return candidates.map(function(c) {
      var mins = Math.round((c.originTime - now) / 60000);
      var transferLabel = c.transferStop ? (c.transferStop.address || c.transferStop.name) : 'la parada de trasbordo';
      var walkStep = '';
      if (c.walkMeters > 0 && c.boardStop) {
        var walkMins = Math.max(1, Math.round(c.walkMeters / 70));
        walkStep = journeyStep('Caminás', 'walk', '', { label: c.boardStop.address || c.boardStop.name, stop: c.boardStop }, '~' + c.walkMeters + ' m (unos ' + walkMins + ' min)');
      }
      return '<div class="arrival convenient">' +
        '<div class="journey-head"><span class="step-route">' + escapeHtml(c.leg1Route) + ' <span class="tag-ok">con transbordo</span></span><span class="journey-when">' + (mins <= 0 ? 'Ahora' : mins + ' min') + '</span></div>' +
        journeyStep('Subís', 'board', c.leg1Headsign, { label: c.originStop.address || c.originStop.name, stop: c.originStop }, 'Sale a las ' + fmtClockTime(c.originTime)) +
        journeyStep('Bajás', 'alight', '', { label: transferLabel, stop: c.transferStop }, 'Llegás ~' + fmtClockTime(c.transferArrival)) +
        walkStep +
        journeyStep('Subís', 'board', c.leg2Route + ' · ' + c.leg2Headsign, null, 'Sale ~' + fmtClockTime(c.transferBoard)) +
        journeyStep('Bajás', 'alight', '', { label: c.destStop.address || c.destStop.name, stop: c.destStop }, 'Llegás ~' + fmtClockTime(c.destTime)) +
      '</div>';
    }).join('');
  }

  // La búsqueda de "mejor opción"/"con transbordo" vive en el Worker (mendotran-proxy),
  // no acá — así queda disponible como API para cualquier otra app, no solo LimpiArte.
  function fetchRoute(fromLat, fromLon, toLat, toLon) {
    var url = OBA_BASE + 'route.json?fromLat=' + fromLat + '&fromLon=' + fromLon + '&toLat=' + toLat + '&toLon=' + toLon;
    return fetch(url).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(body) {
      if (body.code !== 200) throw new Error(body.text || ('código ' + body.code));
      return body.data;
    });
  }

  function renderTransitContent(data) {
    var el = document.getElementById('transitContent');
    if (!el) return;
    if (data.direct && data.direct.length) {
      el.innerHTML = '<div class="section-title">Mejores opciones</div><div class="transit-result">' + candidatesHtml(data.direct) + '</div>';
      return;
    }
    if (data.transfer && data.transfer.length) {
      el.innerHTML = '<div class="section-title">Combinaciones con transbordo</div><div class="transit-result">' + twoLegCandidatesHtml(data.transfer) + '</div>';
      return;
    }
    var fb = data.fallback || {};
    var html = '<div class="section-title">Te subís acá</div>' +
      (fb.originStop ? stopLocationHtml(fb.originStop) + arrivalsHtml(fb.originArrivals || [], {}) : '<p style="font-size:13px;color:var(--muted);">No se encontraron paradas cercanas.</p>') +
      '<p style="font-size:11.5px;color:var(--muted);margin-top:8px;">No encontramos ni una línea directa ni una combinación con transbordo entre las paradas cercanas — probá con "Ver ruta completa en Google Maps".</p>' +
      '<div class="section-title">Te bajás cerca de la casa</div>' +
      (fb.destStop ? stopLocationHtml(fb.destStop) : '<p style="font-size:13px;color:var(--muted);">No se encontró una parada cercana.</p>');
    el.innerHTML = html;
  }

  function openTransitSheet(home) {
    var html = '<h2>Cómo llego</h2>' +
      '<p style="font-size:13px;color:var(--muted);margin-top:-6px;">' + escapeHtml(home.name) + '</p>' +
      '<div id="transitContent"><p class="transit-loading">Buscando las mejores opciones...</p></div>' +
      '<div class="btn-row">' +
        '<a class="btn btn-outline" style="text-align:center;line-height:2.2;text-decoration:none;" id="transitArteLink" href="https://santiagososa.com.ar/transportarte/" target="_blank" rel="noopener">Abrir en TransportArte</a>' +
        '<a class="btn btn-primary" style="text-align:center;line-height:2.2;text-decoration:none;" id="transitMapsLink" href="' + mapsUrl(home) + '" target="_blank" rel="noopener">Ver ruta completa en Google Maps</a>' +
      '</div>';
    openModal(html);

    if (!home.lat || !home.lon) {
      var elEarly = document.getElementById('transitContent');
      if (elEarly) elEarly.innerHTML = '<p style="font-size:13px;color:var(--muted);">Este hogar no tiene ubicación guardada todavía.</p>';
      return;
    }

    getCurrentPosition().then(function(pos) {
      var link = document.getElementById('transitMapsLink');
      if (link) {
        link.href = 'https://www.google.com/maps/dir/?api=1&origin=' + pos.lat + ',' + pos.lon + '&destination=' + home.lat + ',' + home.lon + '&travelmode=transit';
      }
      var arteLink = document.getElementById('transitArteLink');
      if (arteLink) {
        arteLink.href = 'https://santiagososa.com.ar/transportarte/?fromLat=' + pos.lat + '&fromLon=' + pos.lon + '&toLat=' + home.lat + '&toLon=' + home.lon;
      }
      return fetchRoute(pos.lat, pos.lon, home.lat, home.lon).then(function(data) {
        renderTransitContent(data);
      });
    }).catch(function(err) {
      var el = document.getElementById('transitContent');
      if (!el) return;
      var isPermDenied = err.code === 1;
      var msg = isPermDenied
        ? 'No tenemos permiso para usar tu ubicación. En iPhone, una vez que se lo negás a Safari no vuelve a preguntar solo: andá a Ajustes → Privacidad y Seguridad → Localización → Safari (sitios web) y elegí "Preguntar" o "Mientras se usa la app". Después volvé acá y tocá reintentar.'
        : 'No pudimos calcular la ruta (' + escapeHtml(err.message) + ').';
      el.innerHTML = '<p style="font-size:13px;color:var(--muted);">' + msg + '</p>' +
        '<button class="btn btn-outline btn-sm" id="transitRetry" type="button" style="width:100%;margin-top:8px;">Reintentar</button>';
      var retryBtn = document.getElementById('transitRetry');
      if (retryBtn) retryBtn.addEventListener('click', function() { openTransitSheet(home); });
    });
  }

  // ---------- Delegated delete-payment clicks ----------
  document.addEventListener('click', function(e) {
    var delBtn = e.target.closest('[data-delpay]');
    if (delBtn) {
      var id = delBtn.getAttribute('data-delpay');
      db.payments = db.payments.filter(function(p) { return p.id !== id; });
      save();
      closeModal();
      renderAll();
      toast('Pago eliminado');
    }
  });

  // ---------- Notifications ----------
  var notifiedIds = (function() {
    try { return new Set(JSON.parse(localStorage.getItem(NOTIF_KEY) || '[]')); } catch (e) { return new Set(); }
  })();
  function saveNotified() { localStorage.setItem(NOTIF_KEY, JSON.stringify(Array.from(notifiedIds))); }

  function checkNotifications() {
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    var now = Date.now();
    db.shifts.forEach(function(s) {
      if (s.status !== 'scheduled' || !s.startTime) return;
      var dt = new Date(s.date + 'T' + s.startTime).getTime();
      var diffMin = (dt - now) / 60000;
      if (diffMin > 0 && diffMin <= 30 && !notifiedIds.has(s.id)) {
        var home = getHome(s.homeId);
        try {
          new Notification('Próxima casa en ' + Math.round(diffMin) + ' min', {
            body: (home ? home.name : '') + (home && home.address ? ' · ' + home.address : '')
          });
        } catch (e) {}
        notifiedIds.add(s.id);
        saveNotified();
      }
    });
  }
  setInterval(checkNotifications, 60000);

  // ---------- Nav / tabs ----------
  function setView(view) {
    state.view = view;
    document.querySelectorAll('nav.tabs button').forEach(function(b) {
      b.classList.toggle('active', b.getAttribute('data-view') === view);
    });
    document.getElementById('view-agenda').hidden = view !== 'agenda';
    document.getElementById('view-hogares').hidden = view !== 'hogares';
    document.getElementById('view-deudas').hidden = view !== 'deudas';
  }
  document.querySelectorAll('nav.tabs button').forEach(function(b) {
    b.addEventListener('click', function() { setView(b.getAttribute('data-view')); });
  });

  document.getElementById('prevWeek').addEventListener('click', function() {
    state.weekStart = addDays(state.weekStart, -7);
    state.selectedDate = toDateStr(addDays(fromDateStr(state.selectedDate), -7));
    renderAgenda();
  });
  document.getElementById('nextWeek').addEventListener('click', function() {
    state.weekStart = addDays(state.weekStart, 7);
    state.selectedDate = toDateStr(addDays(fromDateStr(state.selectedDate), 7));
    renderAgenda();
  });
  document.getElementById('goToday').addEventListener('click', function() {
    state.weekStart = startOfWeek(new Date());
    state.selectedDate = todayStr();
    state.monthCursor = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    renderAgenda();
  });

  document.querySelectorAll('#agendaModeToggle button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      state.agendaMode = btn.getAttribute('data-mode');
      document.querySelectorAll('#agendaModeToggle button').forEach(function(b) { b.classList.toggle('active', b === btn); });
      document.getElementById('weekStripRow').hidden = state.agendaMode !== 'week';
      document.getElementById('monthNavRow').hidden = state.agendaMode !== 'month';
      renderAgenda();
    });
  });
  document.getElementById('prevMonth').addEventListener('click', function() {
    state.monthCursor = addMonths(state.monthCursor, -1);
    renderAgenda();
  });
  document.getElementById('nextMonth').addEventListener('click', function() {
    state.monthCursor = addMonths(state.monthCursor, 1);
    renderAgenda();
  });

  document.getElementById('fabBtn').addEventListener('click', function() {
    if (state.view === 'hogares') {
      openHogarModal(null);
    } else {
      openTurnoModal(null, state.selectedDate);
    }
  });

  // ---------- Init ----------
  function init() {
    renderThemeSwitch();
    renderModeToggle();
    renderAll();
    if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
      setTimeout(function() {
        Notification.requestPermission().then(function() { checkNotifications(); });
      }, 1500);
    } else {
      checkNotifications();
    }
  }
  init();
})();
</script>
</body>
</html>
